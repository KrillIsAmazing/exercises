<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatroom</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        #chat-window { flex: 1; background: white; border: 1px solid #ccc; border-radius: 5px; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        #form { display: flex; gap: 10px; }
        #input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .message { margin-bottom: 8px; padding: 5px 10px; background: #e9ecef; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="chat-window"></div>

    <form id="form">
        <input id="input" autocomplete="off" placeholder="Type a message..." required />
        <button>Send</button>
    </form>

    <!-- Include Socket.io client library -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const chatWindow = document.getElementById('chat-window');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                // Send message to the server
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        // Listen for messages broadcasted by the server
        socket.on('chat message', (msg) => {
            const item = document.createElement('div');
            item.className = 'message';
            item.textContent = msg;
            chatWindow.appendChild(item);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll to bottom
        });
    </script>
</body>
</html>
